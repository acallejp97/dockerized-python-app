name: Build and Push Docker Image

on:
  push:
    branches:
      - main

    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker-build.yml'
      - 'tests/**'
      - 'conftest.py'
      - 'ruff.toml'
    
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.10'
          enable-cache: true
      - name: Install lint dependencies
        run: uv sync --locked --no-default-groups --group lint
      - name: Run ruff
        run: uv run --locked --no-sync ruff check --line-length 120 .
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.10'
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run tests with coverage
        run: uv run --locked --no-sync pytest --cov=app --cov-fail-under=80 app tests

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Build the Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
      - name: Push the Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
